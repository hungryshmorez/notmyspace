name: Deploy That Time Again Studios

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Studios source
        uses: actions/checkout@v4
        with:
          repository: hungryshmorez/Site
          ref: main
          path: site-source

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Studios site
        uses: actions/upload-pages-artifact@v4
        with:
          path: site-source/public/studios

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
